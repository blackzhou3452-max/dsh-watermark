# dsh-watermark bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field) over
# dsh-base; activate with
#   dsh plugin --profile web add link:D:/dsh-watermark
#
# The row is a bare plugin by package name. This plugin is host-only (it exposes a
# tool), so there is no `dsh.client` declaration in package.json.
- insert:
    - id: dsh-watermark
      name: dsh-watermark
